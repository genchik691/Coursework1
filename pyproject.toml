[project]
name = "coursework1"
version = "0.1.0"
description = "Приложение для анализа банковских транзакций"
authors = [
    {name = "Gennadiy Kokaulin",email = "Genchik691@gmail.com"}
]
license = "MIT"
readme = "README.md"
package-mode = false
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.1.0"
openpyxl = "^3.1.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
flake8 = "^6.1.0"
isort = "^5.13.0"
pytest-mock = "^3.12.0"
mypy = "^1.8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 119
exclude = ["logs", "reports", ".git", "__pycache__", ".venv", ".pytest_cache"]
ignore = ["E203", "W503"]
per-file-ignores = ["tests/*: S101"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
